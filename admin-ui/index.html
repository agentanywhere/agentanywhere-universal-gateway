<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="AgentAnywhere Universal Gateway admin console — observability, routing, and AI insights for multi-protocol traffic."
    />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e14" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%232CC7FE'/%3E%3Cstop offset='.55' stop-color='%232D63F6'/%3E%3Cstop offset='1' stop-color='%236729F4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Cpath d='M17.5 6 9 18h6l-1.5 8L22 14h-6l1.5-8Z' fill='%23fff'/%3E%3C/svg%3E"
    />

    <script>
      // Apply persisted theme before paint to avoid a flash of incorrect theme.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          // Sovereign Dark is the default; a saved choice wins.
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch (_) {}
      })();
    </script>

    <title>Gateway Admin — AgentAnywhere</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
