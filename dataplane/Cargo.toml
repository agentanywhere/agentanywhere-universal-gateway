[package]
name = "agentanywhere-dataplane"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Rust data plane for the AgentAnywhere Universal Gateway (phase 1, experimental)"

[[bin]]
name = "dataplane"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
sha2 = "0.10"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "fast-rng"] }
fastrand = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
