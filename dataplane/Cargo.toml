[package]
name = "agentanywhere-dataplane"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Rust data plane for the AgentAnywhere Universal Gateway (experimental)"

[[bin]]
name = "dataplane"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http-body-util = "0.1"
bytes = "1"
sha2 = "0.10"
arc-swap = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4", "fast-rng"] }
fastrand = "2"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
