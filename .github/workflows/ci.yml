# Lint, test, and build the Python package on every push and pull request.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff build

      - name: Lint
        run: |
          python -m compileall -q app admin
          ruff check app admin tests --select F821,F823

      - name: Test
        run: >
          pytest
          -o addopts="-v --strict-markers --tb=short --cov=app --cov=admin --cov-report=term-missing --cov-report=xml"

      - name: Build sdist and wheel
        run: python -m build
