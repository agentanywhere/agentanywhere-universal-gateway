# Lint, test, and build the Python package on every push and pull request.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff build

      - name: Lint
        run: |
          python -m compileall -q app admin
          ruff check app admin tests --select F821,F823

      - name: Documentation checks
        run: |
          python scripts/check_docs.py
          python scripts/check_env_vars.py
          python scripts/generate_http_reference.py --check

      - name: Test
        run: >
          pytest
          -o addopts="-v --strict-markers --tb=short --cov=app --cov=admin --cov-report=term-missing --cov-report=xml"

      - name: Build sdist and wheel
        run: python -m build

  admin-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  dataplane:
    # Experimental Rust data plane: unit tests, then the same scenarios against the Python
    # gateway and the data plane in front of it (dataplane/conformance/run.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Rust unit tests
        working-directory: dataplane
        run: cargo test --locked
      - name: Build
        working-directory: dataplane
        run: cargo build --release --locked
      - name: Conformance against the Python gateway
        run: python dataplane/conformance/run.py
