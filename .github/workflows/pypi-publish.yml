name: Publish to PyPI

# Build and publish the agentanywhere-universal-gateway package on every tag of
# the form `v*` (e.g. v1.0.0, v1.1.0-rc1). Uses PyPI Trusted Publishing
# (OIDC) — no long-lived API tokens stored in GitHub secrets.
#
# One-time setup on PyPI:
#   1. Reserve the project name `agentanywhere-universal-gateway` on pypi.org.
#   2. Configure Trusted Publisher with:
#        owner: shephertz
#        repository: agentanywhere-universal-gateway
#        workflow: pypi-publish.yml
#        environment: pypi
#   3. (optional) Same for test.pypi.org with environment `test-pypi` if
#      you want a dry-run target on `v*-rc*` tags.
#
# After setup, publishing is just `git tag v1.0.0 && git push --tags`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "test-pypi"
        type: choice
        options:
          - test-pypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package metadata
        run: |
          twine check dist/*
          # Refuse to publish if pyproject.toml is still pinned to the
          # squatted name on PyPI — defensive against accidental reverts.
          python - <<'PY'
          import sys
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          name = data["project"]["name"]
          if name != "agentanywhere-universal-gateway":
              sys.stderr.write(
                  f"Refusing to publish: project name is '{name}', "
                  "expected 'agentanywhere-universal-gateway'.\n"
              )
              sys.exit(1)
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-test:
    name: Publish to TestPyPI
    needs: build
    if: |
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.target == 'test-pypi'
    runs-on: ubuntu-latest
    environment:
      name: test-pypi
      url: https://test.pypi.org/project/agentanywhere-universal-gateway/
    permissions:
      id-token: write  # Trusted Publishing OIDC
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish to PyPI
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentanywhere-universal-gateway/
    permissions:
      id-token: write  # Trusted Publishing OIDC
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
