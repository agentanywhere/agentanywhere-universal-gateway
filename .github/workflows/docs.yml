# Build the documentation site on every pull request; publish it to GitHub Pages from main
# only when the repository variable DOCS_DEPLOY is "true" (Settings, Secrets and variables,
# Actions, Variables) and Pages is set to "GitHub Actions" (Settings, Pages).
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "hooks/**", "requirements-docs.txt", "README.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "hooks/**", "requirements-docs.txt", "README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Check Markdown links and anchors
        run: python scripts/check_docs.py
      - name: Build (warnings are errors)
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
