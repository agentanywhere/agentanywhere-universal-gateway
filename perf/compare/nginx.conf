# The floor: nginx as a reverse proxy that checks one static API key. Filled in by
# target_up.sh (@KEY@, @BACKEND@, @WORKERS@).
worker_processes @WORKERS@;
pid /tmp/bench-nginx.pid;
error_log /tmp/bench-nginx-error.log warn;
events { worker_connections 16384; }
http {
  access_log off;
  map_hash_bucket_size 128;
  upstream backend { server @BACKEND_HOSTPORT@; keepalive 256; }
  map $http_x_api_key $key_ok { default 0; "@KEY@" 1; }
  server {
    listen 8000 reuseport backlog=65535;
    location / {
      if ($key_ok = 0) { return 401 '{"error":"API key required"}'; }
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://backend;
    }
  }
}
