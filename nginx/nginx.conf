# Nginx reverse proxy configuration for AgentAnywhere Universal Gateway
# Provides HTTPS/TLS termination and load balancing
#
# This file is a server-level configuration: it is installed as
# /etc/nginx/conf.d/default.conf (nginx/Dockerfile and docker-compose.yml),
# which the stock nginx.conf includes inside its http {} block. It cannot be
# used as /etc/nginx/nginx.conf itself (no events {} / http {} blocks).

upstream gateway_backend {
    least_conn;
    server gateway:8000 max_fails=3 fail_timeout=30s;
    # Add more servers for load balancing:
    # server gateway2:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL/TLS Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/gateway_access.log;
    error_log /var/log/nginx/gateway_error.log warn;

    # Client body size limit (100M supports large uploads e.g. recordings;
    # raise/lower per deployment). Every nginx hop in front of the gateway
    # must use a value >= this or the smallest one wins and returns 413.
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    # Allow slow clients to finish streaming a large body without a timeout.
    client_body_timeout 300s;

    # Timeouts (generous enough for large uploads / long-lived streams).
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Gateway API endpoints
    location / {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffering: stream large request bodies straight to the backend
        # (avoids buffering big uploads to disk and reduces upload latency).
        proxy_request_buffering off;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Caching
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Operational endpoints: /metrics and /health/detailed are answered only
    # for loopback and private (RFC 1918 / IPv6 unique-local) addresses;
    # everyone else gets 403.
    #
    # To change who may read them, edit the allow lines in BOTH blocks below:
    # one address or CIDR per line, for example "allow 203.0.113.7;" for a
    # monitoring host, and remove ranges you do not use. Keep "deny all;" last
    # (nginx checks the rules in order and the first match wins).
    #
    # The check uses the client address nginx sees ($remote_addr):
    # - If another proxy or load balancer sits in front of this nginx, that is
    #   the proxy's address. Set set_real_ip_from / real_ip_header first, or
    #   the list admits everyone the proxy forwards.
    # - Under Docker, connections relayed by Docker's userland proxy appear to
    #   come from the bridge gateway (inside 172.16.0.0/12).
    # - The gateway's own port 8000 bypasses this nginx entirely.
    # For a credential check that does not depend on the network path, also set
    # OPS_ENDPOINTS_REQUIRE_ADMIN=true in the gateway (see docs/CONFIGURATION.md).
    #
    # If you change METRICS_PATH, change "location /metrics" to match.
    location /metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        deny all;

        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # More specific than "location /health" above, so it takes precedence.
    location /health/detailed {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        deny all;

        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}


