<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="220" viewBox="0 0 1050 220" role="img" aria-labelledby="title desc">
  <title id="title">AgentAnywhere logo</title>
  <desc id="desc">Editable vector logo for AgentAnywhere: stylized letter A, direction mark and intelligence spark.</desc>


  <defs>
    <linearGradient id="aa-main" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#2CC7FE"/>
      <stop offset="0.46" stop-color="#318AF9"/>
      <stop offset="0.76" stop-color="#2D63F6"/>
      <stop offset="1" stop-color="#3D28EA"/>
    </linearGradient>
    <linearGradient id="aa-purple" x1="0" y1="1" x2="1" y2="0.1">
      <stop offset="0" stop-color="#6729F4" stop-opacity="0.98"/>
      <stop offset="0.52" stop-color="#4B35F1" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#344AF2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aa-blue-word" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#318FF7"/>
      <stop offset="1" stop-color="#2D66F4"/>
    </linearGradient>
    <filter id="aa-soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000817" flood-opacity="0.34"/>
    </filter>
    <mask id="aa-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="420">
      <rect width="500" height="420" fill="black"/>
      <!-- Broad outer A silhouette -->
      <path fill="white" d="M250 18
        C244 18 240 27 235 36
        L49 360
        C39 378 47 393 66 395
        C87 397 108 386 128 374
        L238 308
        C244 304 247 302 250 300
        C253 302 256 304 262 308
        L372 374
        C392 386 413 397 434 395
        C453 393 461 378 451 360
        L265 36
        C260 27 256 18 250 18 Z"/>
      <!-- Inner triangular aperture -->
      <path fill="black" d="M250 126 L181 251
        C202 248 222 246 239 250
        C243 251 247 252 250 252
        C253 252 257 251 261 250
        C278 246 298 248 319 251 Z"/>
      <!-- Direction/agent sweep + central intelligence spike -->
      <path fill="black" d="M120 294
        C165 267 205 254 238 250
        L243 250
        L250 310
        L257 250
        L262 250
        C298 254 341 268 390 295
        C338 270 299 263 264 262
        L258 307
        C255 312 253 315 250 317
        C247 315 245 312 242 307
        L236 262
        C200 263 163 272 120 294 Z"/>
    </mask>
  </defs>
  <g id="logo-horizontal">
    <g transform="translate(25 20) scale(0.48)">
  <g id="symbol" mask="url(#aa-cut)">
    <rect x="35" y="10" width="430" height="395" fill="url(#aa-main)"/>
    <!-- Purple light fold on the lower-left leg -->
    <path d="M42 370 C69 320 91 286 126 269 C162 252 198 251 230 260
             C186 278 145 309 103 351 C79 375 58 387 42 370 Z"
          fill="url(#aa-purple)" opacity="0.96"/>
  </g></g>
    <g id="wordmark" transform="translate(270 103)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-4.2" fill="#FFFFFF">Agent</text>
      <text x="248" y="0" font-family="Inter, Arial, sans-serif" font-size="88" font-weight="600" letter-spacing="-4.2" fill="url(#aa-blue-word)">Anywhere</text>
    </g>
    <text id="tagline" x="280" y="170" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="5.4" fill="#A6AEC0">ANY AGENT. ANY MODEL. ANYWHERE.</text>
  </g>
</svg>
